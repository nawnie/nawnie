t><text x="700" y="152" font-size="23" fill="#111F32" font-weight="700">Compare to baseline</text><text x="700" y="193" font-size="17" fill="#596778" font-weight="400">No invented scores</text><line x1="320" y1="152" x2="348" y2="152" stroke="#116A64" stroke-width="3"/><path d="M 339 145 L 348 152 L 339 159" fill="none" stroke="#116A64" stroke-width="3"/><line x1="646" y1="152" x2="674" y2="152" stroke="#596778" stroke-width="3"/><text x="28" y="285" font-size="24" fill="#111F32" font-weight="700">Proposed target: Qwen Image 2.1</text><text x="28" y="323" font-size="18" fill="#596778" font-weight="400">Existing workbench; image training is a design extension, not a verified feature.</text></g><text x="50" y="667" font-size="22" fill="#FFFFFF" font-weight="600">Proposed image workflow</text><text x="50" y="709" font-size="16" fill="#BCC9D6" font-weight="400">Portfolio sample  /  No client-confidential data</text></g></svg>