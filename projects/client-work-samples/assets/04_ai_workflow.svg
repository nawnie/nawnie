<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img"><title>AI Task Routing and Human Approval Workflow</title><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1000" height="750" rx="0" fill="#111F32"/><text x="50" y="57" font-size="17" fill="#BCC9D6" font-weight="600">SHAWN O&#x27;HAGAN  /  SELECTED WORK</text><text x="863" y="57" font-size="18" fill="#BCC9D6" font-weight="600">04 / 07</text><text x="50" y="134" font-size="49" fill="#FFFFFF" font-weight="700">Automate the routine.</text><text x="50" y="195" font-size="49" fill="#FFFFFF" font-weight="700">Review the sensitive.</text><text x="50" y="253" font-size="17" fill="#9CC8BC" font-weight="600">AI SYSTEMS DESIGN</text><g transform="translate(50 290) scale(.9)"><rect x="0" y="0" width="1000" height="360" rx="0" fill="#F5F3EC"/><text x="28" y="39" font-size="17" fill="#596778" font-weight="700">BOUNDED AUTOMATION</text><text x="724" y="39" font-size="17" fill="#596778" font-weight="400">Architecture sample</text><rect x="28" y="142" width="170" height="95" rx="9" fill="#FFFFFF" stroke="#D1D9DA" stroke-width="2"/><text x="47" y="181" font-size="19" fill="#111F32" font-weight="700">Typed intake</text><text x="47" y="214" font-size="15" fill="#596778" font-weight="400">Request + scope</text><line x1="198" y1="189" x2="245" y2="189" stroke="#116A64" stroke-width="3"/><path d="M 236 182 L 245 189 L 236 196" fill="none" stroke="#116A64" stroke-width="3"/><rect x="245" y="142" width="195" height="95" rx="12" fill="#E7EEE9"/><text x="263" y="181" font-size="19" fill="#111F32" font-weight="700">Allowed action?</text><text x="263" y="214" font-size="15" fill="#596778" font-weight="400">Permission check</text><line x1="440" y1="189" x2="480" y2="189" stroke="#116A64" stroke-width="3"/><line x1="480" y1="108" x2="480" y2="269" stroke="#116A64" stroke-width="3"/><line x1="480" y1="108" x2="530" y2="108" stroke="#116A64" stroke-width="3"/><path d="M 521 101 L 530 108 L 521 115" fill="none" stroke="#116A64" stroke-width="3"/><line x1="480" y1="269" x2="530" y2="269" stroke="#116A64" stroke-width="3"/><path d="M 521 262 L 530 269 L 521 276" fill="none" stroke="#116A64" stroke-width="3"/><rect x="530" y="65" width="205" height="84" rx="9" fill="#FFFFFF" stroke="#D1D9DA" stroke-width="2"/><text x="550" y="100" font-size="23" fill="#116A64" font-weight="700">Read only</text><text x="550" y="131" font-size="17" fill="#596778" font-weight="400">Bounded tool call</text><rect x="530" y="224" width="205" height="86" rx="9" fill="#FFFFFF" stroke="#D1D9DA" stroke-width="2"/><text x="550" y="260" font-size="19" fill="#BF4D26" font-weight="700">Sensitive write</text><text x="550" y="291" font-size="15" fill="#596778" font-weight="400">Approval required</text><line x1="735" y1="108" x2="786" y2="108" stroke="#116A64" stroke-width="3"/><path d="M 777 101 L 786 108 L 777 115" fill="none" stroke="#116A64" stroke-width="3"/><line x1="735" y1="268" x2="786" y2="268" stroke="#116A64" stroke-width="3"/><path d="M 777 261 L 786 268 L 777 275" fill="none" stroke="#116A64" stroke-width="3"/><rect x="786" y="65" width="186" height="84" rx="12" fill="#E7EEE9"/><text x="805" y="103" font-size="21" fill="#111F32" font-weight="700">Result receipt</text><text x="805" y="132" font-size="16" fill="#596778" font-weight="400">Evidence retained</text><rect x="786" y="224" width="186" height="86" rx="12" fill="#E7EEE9"/><text x="805" y="260" font-size="17" fill="#111F32" font-weight="700">Approve or stop</text><text x="805" y="291" font-size="15" fill="#596778" font-weight="400">No silent fallback</text><text x="28" y="342" font-size="18" fill="#596778" font-weight="400">Failure stays visible; a proposed action is not a completed action.</text></g><text x="50" y="667" font-size="22" fill="#FFFFFF" font-weight="600">Architecture sample</text><text x="50" y="709" font-size="16" fill="#BCC9D6" font-weight="400">Portfolio sample  /  No client-confidential data</text></g></svg>