<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img"><title>Hotel Demand and Staffing Planner</title><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1000" height="750" rx="0" fill="#111F32"/><text x="50" y="57" font-size="17" fill="#BCC9D6" font-weight="600">SHAWN O&#x27;HAGAN  /  SELECTED WORK</text><text x="863" y="57" font-size="18" fill="#BCC9D6" font-weight="600">01 / 07</text><text x="50" y="134" font-size="49" fill="#FFFFFF" font-weight="700">Room demand into</text><text x="50" y="195" font-size="49" fill="#FFFFFF" font-weight="700">staffing hours</text><text x="50" y="253" font-size="17" fill="#9CC8BC" font-weight="600">OPERATIONS AUTOMATION</text><g transform="translate(50 290) scale(.9)"><rect x="0" y="0" width="1000" height="360" rx="0" fill="#F5F3EC"/><text x="28" y="40" font-size="17" fill="#596778" font-weight="700">STAFFING PLAN</text><text x="720" y="40" font-size="17" fill="#596778" font-weight="400">Fictional example</text><rect x="28" y="64" width="294" height="139" rx="12" fill="#E7EEE9"/><text x="50" y="98" font-size="17" fill="#596778" font-weight="600">ROOMS TO SERVICE</text><text x="50" y="153" font-size="43" fill="#116A64" font-weight="700">80</text><text x="50" y="182" font-size="16" fill="#596778" font-weight="400">30 departures / 50 stayovers</text><rect x="352" y="64" width="294" height="139" rx="12" fill="#E7EEE9"/><text x="374" y="98" font-size="17" fill="#596778" font-weight="600">BUFFERED WORKLOAD</text><text x="374" y="153" font-size="43" fill="#116A64" font-weight="700">30.25</text><text x="374" y="182" font-size="16" fill="#596778" font-weight="400">labor hours</text><rect x="676" y="64" width="294" height="139" rx="12" fill="#E7EEE9"/><text x="698" y="98" font-size="17" fill="#596778" font-weight="600">PLANNING ESTIMATE</text><text x="698" y="153" font-size="43" fill="#116A64" font-weight="700">6</text><text x="698" y="182" font-size="16" fill="#596778" font-weight="400">staff at 6 productive hours</text><text x="28" y="241" font-size="17" fill="#596778" font-weight="400">Checkout workload</text><text x="510" y="241" font-size="17" fill="#596778" font-weight="400">Stayover workload</text><rect x="28" y="259" width="492" height="28" rx="4" fill="#116A64"/><rect x="520" y="259" width="410" height="28" rx="4" fill="#84ADA6"/><text x="28" y="321" font-size="20" fill="#111F32" font-weight="500">900 min + 750 min = 1,650 min; add 10% buffer = 1,815 min</text></g><text x="50" y="667" font-size="22" fill="#FFFFFF" font-weight="600">Working portfolio demo</text><text x="50" y="709" font-size="16" fill="#BCC9D6" font-weight="400">Portfolio sample  /  No client-confidential data</text></g></svg>