xt><line x1="372" y1="226" x2="626" y2="226" stroke="#D1D9DA" stroke-width="2"/><text x="372" y="253" font-size="16" fill="#596778" font-weight="400">Human review checkpoint</text><rect x="676" y="75" width="294" height="198" rx="12" fill="#FFFFFF" stroke="#D1D9DA" stroke-width="2"/><text x="696" y="113" font-size="17" fill="#116A64" font-weight="700">03  EDIT</text><text x="696" y="161" font-size="25" fill="#111F32" font-weight="700">Qwen Image 2.1</text><text x="696" y="200" font-size="17" fill="#596778" font-weight="400">Instruction + source image</text><line x1="696" y1="226" x2="950" y2="226" stroke="#D1D9DA" stroke-width="2"/><text x="696" y="253" font-size="16" fill="#596778" font-weight="400">Human review checkpoint</text><line x1="322" y1="174" x2="346" y2="174" stroke="#116A64" stroke-width="3"/><path d="M 337 167 L 346 174 L 337 181" fill="none" stroke="#116A64" stroke-width="3"/><line x1="646" y1="174" x2="670" y2="174" stroke="#116A64" stroke-width="3"/><path d="M 661 167 L 670 174 L 661 181" fill="none" stroke="#116A64" stroke-width="3"/><text x="28" y="315" font-size="21" fill="#111F32" font-weight="600">Experimental, separately configured ComfyUI workflows</text><text x="28" y="344" font-size="17" fill="#596778" font-weight="400">No generated-media result or performance benchmark is presented here.</text></g><text x="50" y="667" font-size="22" fill="#FFFFFF" font-weight="600">Development preview</text><text x="50" y="709" font-size="16" fill="#BCC9D6" font-weight="400">Portfolio sample  /  No client-confidential data</text></g></svg>