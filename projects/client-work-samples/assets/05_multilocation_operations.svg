<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img"><title>Multi Site Operations Review and Action Tracking</title><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1000" height="750" rx="0" fill="#111F32"/><text x="50" y="57" font-size="17" fill="#BCC9D6" font-weight="600">SHAWN O&#x27;HAGAN  /  SELECTED WORK</text><text x="863" y="57" font-size="18" fill="#BCC9D6" font-weight="600">05 / 07</text><text x="50" y="134" font-size="49" fill="#FFFFFF" font-weight="700">Several locations.</text><text x="50" y="195" font-size="49" fill="#FFFFFF" font-weight="700">One review queue.</text><text x="50" y="253" font-size="17" fill="#9CC8BC" font-weight="600">OPERATIONS REPORTING</text><g transform="translate(50 290) scale(.9)"><rect x="0" y="0" width="1000" height="360" rx="0" fill="#F5F3EC"/><text x="28" y="40" font-size="17" fill="#596778" font-weight="700">WEEKLY OPERATING REVIEW</text><text x="742" y="40" font-size="17" fill="#596778" font-weight="400">Fictional sample</text><rect x="28" y="65" width="944" height="45" rx="5" fill="#111F32"/><text x="46" y="94" font-size="16" fill="#FFFFFF" font-weight="700">LOCATION</text><text x="190" y="94" font-size="16" fill="#FFFFFF" font-weight="700">EXCEPTION</text><text x="536" y="94" font-size="16" fill="#FFFFFF" font-weight="700">OWNER</text><text x="754" y="94" font-size="16" fill="#FFFFFF" font-weight="700">NEXT ACTION</text><rect x="28" y="110" width="944" height="66" rx="0" fill="#FFFFFF"/><line x1="28" y1="176" x2="972" y2="176" stroke="#D1D9DA" stroke-width="2"/><text x="46" y="150" font-size="19" fill="#111F32" font-weight="500">Site A</text><text x="190" y="150" font-size="19" fill="#111F32" font-weight="500">Labor report missing</text><text x="536" y="150" font-size="19" fill="#111F32" font-weight="500">Ops lead</text><text x="754" y="150" font-size="19" fill="#111F32" font-weight="500">Reconcile source</text><rect x="28" y="176" width="944" height="66" rx="0" fill="#E7EEE9"/><line x1="28" y1="242" x2="972" y2="242" stroke="#D1D9DA" stroke-width="2"/><text x="46" y="216" font-size="19" fill="#111F32" font-weight="500">Site B</text><text x="190" y="216" font-size="19" fill="#111F32" font-weight="500">Maintenance backlog</text><text x="536" y="216" font-size="19" fill="#111F32" font-weight="500">Engineering</text><text x="754" y="216" font-size="19" fill="#111F32" font-weight="500">Set priorities</text><rect x="28" y="242" width="944" height="66" rx="0" fill="#FFFFFF"/><line x1="28" y1="308" x2="972" y2="308" stroke="#D1D9DA" stroke-width="2"/><text x="46" y="282" font-size="19" fill="#111F32" font-weight="500">Site C</text><text x="190" y="282" font-size="19" fill="#111F32" font-weight="500">Inventory mismatch</text><text x="536" y="282" font-size="19" fill="#111F32" font-weight="500">Shift lead</text><text x="754" y="282" font-size="19" fill="#111F32" font-weight="500">Recount stock</text><text x="28" y="342" font-size="18" fill="#596778" font-weight="400">Unknown is a status. Every exception keeps an owner and closeout evidence.</text></g><text x="50" y="667" font-size="22" fill="#FFFFFF" font-weight="600">Operations framework sample</text><text x="50" y="709" font-size="16" fill="#BCC9D6" font-weight="400">Portfolio sample  /  No client-confidential data</text></g></svg>